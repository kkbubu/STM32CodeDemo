<text x="58" y="952" font-size="17" fill="#183449" font-weight="normal" text-anchor="start">首次启动另含准备：三锚点建立 → 后段收缩准备 → 前段收缩准备；REV 按前后镜像执行。</text>
<text x="58" y="979" font-size="17" fill="#183449" font-weight="normal" text-anchor="start">默认按时间交接，不代表真实抓牢；须验证回弹、承重与有效行程，并使用独立承重防坠绳。</text>
