<text x="806" y="150" font-size="21" fill="#183449" font-weight="bold" text-anchor="start">控制与下载</text>
<text x="806" y="187" font-size="16" fill="#183449" font-weight="normal" text-anchor="start">PA9 TX → USB-TTL RX / PA10 RX ← TX</text>
<text x="806" y="221" font-size="16" fill="#183449" font-weight="normal" text-anchor="start">USB-TTL：3.3 V 电平，共地，115200 8N1</text>
<text x="806" y="255" font-size="16" fill="#183449" font-weight="normal" text-anchor="start">PA8 → 许可开关 → GND（闭合允许运行）</text>
<text x="806" y="289" font-size="16" fill="#183449" font-weight="normal" text-anchor="start">PB14 → 常闭停止回路 → GND</text>
<text x="806" y="323" font-size="16" fill="#183449" font-weight="normal" text-anchor="start">断线或按下：冻结输出，不自动泄压</text>
<text x="806" y="357" font-size="16" fill="#183449" font-weight="normal" text-anchor="start">PA13 / PA14 → ST-Link SWDIO / SWCLK</text>
<text x="806" y="391" font-size="16" fill="#183449" font-weight="normal" text-anchor="start">BOOT0 下拉；PC13：状态 LED</text>
<rect x="782" y="466" width="502" height="230" rx="12" fill="white" stroke="#C8D4DC" stroke-width="1.5"/>
<text x="806" y="504" font-size="21" fill="#183449" font-weight="bold" text-anchor="start">可选反馈 · 当前关闭</text>
<text x="806" y="539" font-size="16" fill="#183449" font-weight="normal" text-anchor="start">PA0 / PA1 / PA2：后 / 中 / 前锚定就绪</text>
<text x="806" y="568" font-size="16" fill="#183449" font-weight="normal" text-anchor="start">PA3：公共负压就绪</text>
<text x="806" y="597" font-size="16" fill="#183449" font-weight="normal" text-anchor="start">现有接口接外部处理后的低有效数字信号</text>
<text x="806" y="626" font-size="16" fill="#183449" font-weight="normal" text-anchor="start">模拟传感器须另做 ADC、标定与故障诊断</text>
<text x="806" y="655" font-size="16" fill="#183449" font-weight="normal" text-anchor="start">压力就绪不等于机械抓持力已确认</text>
<rect x="36" y="720" width="1248" height="283" rx="12" fill="white" stroke="#C8D4DC" stroke-width="1.5"/>
<text x="60" y="759" font-size="21" fill="#183449" font-weight="bold" text-anchor="start">单通道裸 N-MOS 低侧驱动示意（11 路相同）</text>
