<path d="M515 835 L515 865 L544 850 Z" fill="none" stroke="#183449" stroke-width="2"/><path d="M550 833 L550 867" stroke="#183449" stroke-width="3"/>
<text x="454" y="890" font-size="16" fill="#183449" font-weight="normal" text-anchor="start">续流二极管：阴极接 +V</text>
<path d="M110 943 L710 943" stroke="#183449" stroke-width="3" fill="none"/>
<text x="110" y="977" font-size="17" fill="#183449" font-weight="normal" text-anchor="start">公共 GND：STM32、MOS S、阀电源负极</text>
<text x="806" y="807" font-size="17" fill="#183449" font-weight="normal" text-anchor="start">• 栅极在 3.3 V 下可靠导通</text>
<text x="806" y="843" font-size="17" fill="#183449" font-weight="normal" text-anchor="start">• 线圈电源电压与额定电压一致</text>
<text x="806" y="879" font-size="17" fill="#183449" font-weight="normal" text-anchor="start">• 有驱动模块时核对内置续流与极性</text>
<text x="806" y="915" font-size="17" fill="#183449" font-weight="normal" text-anchor="start">• MCU 复位期间依靠外部电阻关断</text>
<text x="806" y="951" font-size="17" fill="#183449" font-weight="normal" text-anchor="start">• 线圈需允许持续通电</text>
<rect x="36" y="1024" width="1248" height="69" rx="12" fill="#FFF0D9" stroke="#D6AC65" stroke-width="1.5"/>
<text x="60" y="1065" font-size="18" fill="#895715" font-weight="normal" text-anchor="start">掉电 / 复位会使阀泄压；必须用独立防坠措施。软件 STOP 保持电平，不能保证机械立即停止。</text>
</g></svg>